#root@faq:~# cat /etc/nginx/sites-available/m5_chat.conf
# ---------------------------------------------------------
# 1. 统一处理所有 HTTP (80) 端口的跳转
# ---------------------------------------------------------
server {
    listen 80;
    server_name chat.m5stack.com chatdata.m5stack.com;
    return 301 https://$host$request_uri;
}


# ---------------------------------------------------------
# 2. chat.m5stack.com (指向 5055 端口 + 静态资源)
# ---------------------------------------------------------
server {
    listen 443 ssl;
    server_name chat.m5stack.com;

    ssl_certificate     /etc/nginx/certs/m5stack.com.pem;
    ssl_certificate_key /etc/nginx/certs/m5stack.com.key;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/chat-frontend;
    index index.html;

    # API 代理到 Flask 后端 (5055)
    location /chat_stream {
        proxy_pass http://127.0.0.1:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应必需
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # 与 Flask 端保持一致
        proxy_send_timeout 300s;
    }

    location /submit_feedback {
        proxy_pass http://127.0.0.1:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 新增：带版本号的静态资源 - 长缓存（1年）
    location ~* \.(js|css)$ {
        # 如果 URL 中有 ?v= 参数，说明是带版本号的资源，可以长期缓存
        if ($args ~* "v=") {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        # 没有版本号的资源，短缓存
        if ($args !~* "v=") {
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
        }
        try_files $uri =404;
    }

    # 新增：HTML 文件 - 禁用缓存，确保始终是最新版本
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # 新增：其他静态资源（图片、字体等）- 中等缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 其余所有请求均返回前端 index.html
    location / {
        # HTML 文件也禁用缓存
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}


# ---------------------------------------------------------
# 3. chatdata.m5stack.com (全量转发到 5056 端口)
# ---------------------------------------------------------
server {
    listen 443 ssl;
    server_name chatdata.m5stack.com;

    ssl_certificate     /etc/nginx/certs/m5stack.com.pem;
    ssl_certificate_key /etc/nginx/certs/m5stack.com.key;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:5056;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------------------------------------------------------
# 4. mcp.m5stack.com (新增：转发到 5058 端口)
# ---------------------------------------------------------
server {
    listen 443 ssl;
    server_name mcp.m5stack.com;

    ssl_certificate     /etc/nginx/certs/m5stack.com.pem;
    ssl_certificate_key /etc/nginx/certs/m5stack.com.key;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /sse {
        proxy_pass http://127.0.0.1:5058;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接：关闭缓冲，避免代理层读超时误断开
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /messages {
        proxy_pass http://127.0.0.1:5058;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:5058;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 4m;
        add_header X-Accel-Buffering no;
    }

    location /health {
        proxy_pass http://127.0.0.1:5058;
        proxy_set_header Host $host;
    }
}
